name: UniVulner CD Pipeline

on:
  workflow_run:
    workflows: ["UniVulner CI Pipeline"]
    types:
      - completed

jobs:
  deploy:

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
          -u "${{ secrets.GHCR_USERNAME }}" \
          --password-stdin

      - name: Build FastAPI
        run: |
          docker build \
          -f Docker/Dockerfile.fastapi \
          -t ghcr.io/${{ secrets.GHCR_USERNAME }}/univulner-fastapi:latest \
          .

      - name: Build Scheduler
        run: |
          docker build \
          -f Docker/Dockerfile.scheduler \
          -t ghcr.io/${{ secrets.GHCR_USERNAME }}/univulner-scheduler:latest \
          .

      - name: Push Images
        run: |
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/univulner-fastapi:latest
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/univulner-scheduler:latest

      - name: Deploy EC2
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/univulner

            docker login ghcr.io \
              -u ${{ secrets.GHCR_USERNAME }} \
              -p ${{ secrets.GHCR_TOKEN }}

            docker compose pull

            docker compose up -d

            docker image prune -f

            docker ps